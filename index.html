<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYSTEM://GHOST</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="CSS/style.css" />
</head>

<body>

  <section class="hero">

    <div class="terminal" id="terminalText">
      SYSTEM://GHOST/
    </div>

    <div class="ghost-title" id="ghostTitle">
      GHOST
    </div>

    <div class="hero-buttons">
      <button onclick="scrollToSection('projects')">Projects</button>
      <button onclick="openGithub()">Github</button>
      <button onclick="openAbout()">Sobre</button>
    </div>

  </section>

  <section id="projects" class="projects-system">

    <div class="system-header">
      SYSTEM://GHOST/PROJECTS
    </div>

    <div class="projects-grid">

      <div class="project-box" onclick="openComingSoon('alduin-system')">
        <div class="project-title">ALDUIN SYSTEM</div>
        <div class="project-desc">Personal AI assistant concept</div>
        <div class="project-status">STATUS: IN DEVELOPMENT</div>
      </div>

      <div class="project-box" onclick="openComingSoon('cyber-dashboard')">
        <div class="project-title">CYBER DASHBOARD</div>
        <div class="project-desc">Security monitoring interface</div>
        <div class="project-status">STATUS: IN DEVELOPMENT</div>
      </div>

      <div class="project-box" onclick="openGhostRepo()">
        <div class="project-title">SYSTEM://GHOST</div>
        <div class="project-desc">This very system UI</div>
        <div class="project-status">STATUS: BETA</div>
      </div>

    </div>

  </section>

  <script src="JS/terminal.js"></script>
  <script src="JS/navigation.js"></script>
  <script src="JS/effects.js"></script>
  <script src="JS/main.js"></script>
</body>

</html>

<!-- ~Ghost, The Shadow~ -->
