<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM://GHOST/ABOUT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

  <section class="about-system">

    <div class="system-header" id="terminalText">
      SYSTEM://GHOST/ABOUT
    </div>

    <div class="terminal" id="terminal"></div>

    <div class="profile-box">

      <div class="profile-title">
        USER PROFILE: GHOST
      </div>

      <div class="profile-line">STATUS: ACTIVE</div>
      <div class="profile-line">ROLE: DEVELOPER / EXPLORER</div>
      <div class="profile-line">SYSTEM ACCESS: LIMITED</div>
      <div class="profile-line">LOCATION: UNKNOWN</div>

      <button class="return-core" onclick="openIdentity()">
        WHO AM I?????
      </button>

    </div>

  </section>

  <script src="script.js"></script>
</body>

</html>
